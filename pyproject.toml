[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eqvis-workflow"
version = "0.1.0"
description = "Figures for earthquake simulation workflows: intensity measure maps, attenuation and bias plots, spectra, waveforms, rupture maps and wavefield animations."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Jake Faulkner", email = "jake.faulkner@canterbury.ac.nz" }]
dependencies = [
    "duckdb",
    "h5netcdf",
    "h5py",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "numpy",
    "pyarrow",
    "pyproj",
    "pyvista",
    "qcore-utils",
    "scipy",
    "shapely",
    "source-modelling",
    "statsmodels",
    "tqdm",
    "typer",
    "xarray",
    "zarr>=3",
]

[project.scripts]
eqvis = "eqvis_workflow.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/eqvis_workflow"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E741", "UP042"]  # UP042: typer reads str-Enums for its choice lists
